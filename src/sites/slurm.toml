# eb-local site file for a Slurm cluster whose jobs get a node-local disk.
#   eb-local site install slurm --set node_local_root=/local \
#       --set shared_scratch=/scratch [--set node_local_fstype=ext4] [--set partition=cpu]
# Each allocation's mount must be <node_local_root>/<user>.<job id>, owned
# by the user; shared_scratch is the parallel file system builds must avoid.

[storage]
node_local_root = "{{node_local_root}}"
node_local_fstype = "{{node_local_fstype:xfs}}"
shared_scratch = ["{{shared_scratch}}"]

[build]
allocation_hint = "salloc -p {{partition:cpu}} -n 16 -t 02:00:00"
# site_toolchains = ["intel/2026.1"]

# Users name their own vault for nimvault secrets in ~/.config/eb-local/config.toml:
#   [nimvault]
#   vault = "~/vault"
