# Git hooks via prek (https://prek.j178.dev). Install: prek install
# Run every hook on the tree: prek run --all-files
#:schema https://www.schemastore.org/prek.json

exclude = """(?x)(
    ^\\.zig-cache/|
    ^zig-out/|
    ^zig-pkg/|
    ^docs/_build/|
    ^.*\\.svg$
)"""

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "zig-fmt",
    name = "zig fmt --check",
    entry = "zig fmt --check",
    language = "system",
    files = "\\.zig$",
  },
  # CI runs shellcheck on eb-local at every level; the site scripts keep
  # some findings of level info.
  {
    id = "shellcheck",
    name = "shellcheck",
    entry = "shellcheck -S warning",
    language = "system",
    types = ["shell"],
  },
]

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "v2.4.1"
hooks = [
  # O_WRONLY is the open(2) flag.
  { id = "codespell", args = ["-L", "wronly"] },
]
