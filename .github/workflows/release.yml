name: release
# On a tag vX.Y.Z: build the static binaries, test each on its own
# architecture, check the version string against the tag, and publish the
# binaries with SHA256SUMS and build provenance attestations.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: zig build unit --summary all
      - run: zig build -Dtest-ops=true test --summary all
      - name: build
        run: |
          zig build --release=safe -Dcommit="${GITHUB_SHA::7}" -Dtarget=${{ matrix.arch }}-linux-musl --prefix out
          want="eb-local ${GITHUB_REF_NAME#v} "
          zon=$(sed -nE 's/^ *\.version = "([^"]+)".*/\1/p' build.zig.zon)
          if [ "${zon}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, build.zig.zon ${zon}"; exit 1
          fi
          ! grep -aq EB_LOCAL_TEST_MOUNTINFO out/bin/eb-local
          ! grep -aq EB_LOCAL_TEST_PRELUDE out/bin/eb-local
          ! grep -aq EB_LOCAL_TEST_CVMFS_ERRNO out/bin/eb-local
          ! grep -aq EB_LOCAL_TEST_CVMFS_CONFIG out/bin/eb-local
          ! grep -aq EB_LOCAL_TEST_STDOUT_WRITES out/bin/eb-local
          got=$(out/bin/eb-local --version)
          case "${got}" in "${want}"*) ;; *) echo "version '${got}' does not match tag ${GITHUB_REF_NAME}"; exit 1 ;; esac
          mkdir dist
          cp out/bin/eb-local "dist/eb-local-${GITHUB_REF_NAME#v}-${{ matrix.arch }}-linux-musl"
          python3 tools/cli_assets.py --out dist/share --tool "eb-local::./out/bin/eb-local"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release notes are the tag's section of CHANGELOG.md, "## X.Y.Z"
      # or "## [X.Y.Z] - date"; a tag without one is not released.
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{ if (on) exit; h = $0; sub(/^## \[?/, "", h); sub(/[] ].*$/, "", h); on = (h == v); next } on' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then echo "CHANGELOG.md has no section for ${v}"; exit 1; fi
          cat release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      # One CycloneDX SBOM per binary, from build.zig.zon and the toolchain.
      - name: SBOMs
        id: sbom
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          for arch in x86_64 aarch64; do
            b="dist/eb-local-${v}-${arch}-linux-musl"
            python3 -I tools/sbom.py --binary "$b" --zon build.zig.zon --zig "$(zig version)" --commit "${GITHUB_SHA}" > "${b}.cdx.json"
          done
      # Completions and man pages are a directory, and a release takes files:
      # one archive, named like the binaries so SHA256SUMS covers it.
      - name: share archive
        run: |
          v="${GITHUB_REF_NAME#v}"
          tar -C dist --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 -czf "dist/eb-local-${v}-share.tar.gz" share
          rm -r dist/share
      - run: cd dist && sha256sum eb-local-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/eb-local-${{ steps.sbom.outputs.version }}-x86_64-linux-musl
          sbom-path: dist/eb-local-${{ steps.sbom.outputs.version }}-x86_64-linux-musl.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/eb-local-${{ steps.sbom.outputs.version }}-aarch64-linux-musl
          sbom-path: dist/eb-local-${{ steps.sbom.outputs.version }}-aarch64-linux-musl.cdx.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft
