name: shellcheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck eb-local
      - run: python3 -m unittest discover -s tests -v
      # A site's own names and paths belong in examples/sites/; release
      # notes may name what a release removed.
      - name: no site names outside examples/sites
        run: |
          ! git grep -nIiE 'snellius|surf\.nl|/gpfs/|/projects/0|rg\.terra|scratch-shared' -- . ':!examples/sites/' ':!CHANGELOG.md' ':!changelog.d/' ':!.github/workflows/shellcheck.yml'
