name: shellcheck
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build -Dtest-ops=true
      - run: shellcheck eb-local
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python3 -m unittest discover -s tests -v
      # A site's own names and paths belong in the site's own repository;
      # release notes may name what a release removed. Each name keeps one
      # letter in brackets, so the pattern does not match its own text.
      - name: no site names
        run: |
          ! git grep -nIiE 'snelli[u]s|sne[l]-|sur[f]\.nl|sur[f]sara|/gp[f]s/|/project[s]/0|r[g]\.terra|scratch-shar[e]d|scratch-nod[e]|eblocalinstal[l]|chatgp[t]\.com|claud[e]\.ai|perplexit[y]\.ai' -- . ':!CHANGELOG.md' ':!changelog.d/'
