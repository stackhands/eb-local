# The CPU targets `eb-local --cpu-target` can present on a host that has
# another one, by the cpuid route. gen_profiles.py turns this file and
# rules/NAME.rules into share/eb-local/mask/profiles.conf.
#
# x86_64 targets: `family`, `model` and `model_name` are the /proc/cpuinfo
# fields; `rules` names the CPUID rule file (gen_cpuid_rules.py); `drop_flags`
# are the /proc/cpuinfo flags that go with the cleared CPUID bits;
# `host_vendors` are the CPU vendors whose hosts the rules can present the
# target on (a rule file that sets the vendor string reaches the other
# vendor); `needs` are flags the host must have and a mask cannot add.
# aarch64 targets: `cpu_part` and `features` are the /proc/cpuinfo fields,
# `gcc_cpu` is the -mcpu value GCC resolves from them, and the hardware
# capability words come from `features`.

[zen2]
subdir = "x86_64/amd/zen2"
arch = "x86_64"
vendor = "AuthenticAMD"
family = 23
model = 49
model_name = "AMD EPYC-Rome (eb-local mask)"
gcc_march = "znver2"
host_vendors = ["AuthenticAMD"]
drop_flags = ["avx512_vp2intersect", "avx_vnni", "movdiri", "movdir64b", "avx512f", "avx512dq", "avx512ifma", "avx512cd", "avx512bw", "avx512vl", "avx512_bf16", "avx512vbmi", "avx512_vbmi2", "gfni", "avx512_vnni", "avx512_bitalg", "avx512_vpopcntdq", "pku", "ospke", "vaes", "vpclmulqdq"]

