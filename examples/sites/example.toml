# Site example: an eb-local site file template for Example University, a
# site that does not exist. It is a worked example of a site's own
# template, not a default, and is not built into eb-local; a site keeps its
# own in a repository of its own. From a checkout of eb-local:
#   eb-local site install examples/sites/example.toml [--set partition=gpu]
# On nodes with the Slurm feature local-disk, each allocation gets its own
# mount of the node's disk, /local/<user>.<job id>. /scratch is the
# parallel file system, which builds must avoid.

[storage]
node_local_root = "/local"
node_local_mount = "%u.%j"
node_local_fstype = "xfs"
shared_scratch = ["/scratch"]

[build]
allocation_hint = "salloc -p {{partition:cpu}} -n 16 -t 02:00:00 --constraint=local-disk"
# site_toolchains = ["intel/2026.1"]

# Software is built for the CPU of the node that builds it, so each
# partition whose nodes have a CPU of their own is a node type, and
# eb-local --explain prints an sbatch line for each.
[build.node_types]
cpu = "-p cpu -n 16 -t 02:00:00 --constraint=local-disk"
gpu = "-p gpu -n 16 -t 02:00:00 --gpus=1 --constraint=local-disk"

# A user who keeps secrets in nimvault names the vault in their own file
# (~/.config/eb-local/config.toml), not here:
#   [nimvault]
#   vault = "~/vault"
