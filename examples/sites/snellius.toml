# Site example: an eb-local site file template for Snellius (SURF). It is a
# worked example of a site's own template, not a default, and is not built
# into eb-local. From a checkout of eb-local:
#   eb-local site install examples/sites/snellius.toml [--set partition=genoa]
# The allocation's node-local NVMe mount is /scratch-node/<user>.<job id>,
# on nodes allocated with --constraint=scratch-node. The acceptance jobs in
# tests/site/ run there with
#   sbatch -p rome --constraint=scratch-node ... tests/site/build-job.sh

[storage]
node_local_root = "/scratch-node"
node_local_mount = "%u.%j"
node_local_fstype = "xfs"
shared_scratch = ["/scratch-shared", "/scratch-local", "/gpfs/scratch1"]

[build]
allocation_hint = "salloc -p {{partition:rome}} -n 16 -t 02:00:00 --constraint=scratch-node"
# site_toolchains = ["intel/2026.1"]

# eb-local submit sends one build job to each: Zen2 (rome) and Zen4 (genoa).
# The Ice Lake target is on the A100 nodes, whose partitions charge GPU time
# for a CPU build; a site enables them when its users need that target.
[build.node_types]
rome = "-p rome -n 16 -t 02:00:00 --constraint=scratch-node"
genoa = "-p genoa -n 16 -t 02:00:00 --constraint=scratch-node"
# icelake = "-p gpu_a100 --gpus-per-node=1 -n 18 -t 02:00:00 --constraint=scratch-node"

# A user who keeps secrets in nimvault names the vault in their own file
# (~/.config/eb-local/config.toml), not here:
#   [nimvault]
#   vault = "~/vault"
